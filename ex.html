<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更新日志 | 官方主页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
body{background:#121212;color:#e0e0e0;line-height:1.6}
.container{max-width:800px;margin:0 auto;padding:20px}
.header{text-align:center;margin:50px 0}
.header h1{font-size:32px;font-weight:700;color:#ffffff}
.header p{color:#999;margin-top:8px}
.log-item{background:#1e1e1e;border-radius:16px;padding:26px;margin-bottom:16px;border-left:4px solid #4f7cff}
.time{display:inline-block;background:#2a2a2a;color:#7aa2ff;padding:5px 12px;border-radius:8px;font-size:14px;margin-bottom:14px}
.version{font-size:20px;font-weight:600;color:#fff;margin-bottom:12px}
.content li{margin-bottom:8px;color:#ddd}
.footer{text-align:center;padding:40px 0;color:#666;font-size:14px}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>更新日志</h1>
        <p>功能更新 · 问题修复 · 版本记录</p>
    </div>

    <div class="log-item">
        <div class="time">2026-03-16</div>
        <div class="version">V1.0.0 · 正式发布</div>
        <ul class="content">
            <li>✅ 上线暗黑模式官方更新日志</li>
            <li>✅ 适配手机、平板、电脑全端</li>
            <li>✅ 极简干净，无广告无依赖</li>
            <li>✅ 可直接部署 GitHub Pages</li>
        </ul>
    </div>

    <div class="log-item">
        <div class="time">即将更新</div>
        <div class="version">V1.1.0 · 规划中</div>
        <ul class="content">
            <li>🟡 新增版本筛选功能</li>
            <li>🟡 优化动画与交互体验</li>
            <li>🟡 支持自定义主题色</li>
        </ul>
    </div>

    <div class="footer">© 2026 官方主页 · 持续更新</div>
</div>
</body>
</html>
